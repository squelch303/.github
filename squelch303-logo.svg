<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>squelch303 logo</title>
  <desc>Geometric logo for squelch303 — a stylized waveform and 303 text mark in acid yellow on black</desc>

  <style>
    .bg { fill: #111; }
    .num { font-family: monospace; font-weight: 700; font-size: 72px; fill: #c8f000; letter-spacing: -2px; }
    .wordmark { font-family: monospace; font-weight: 400; font-size: 22px; fill: #c8f000; letter-spacing: 6px; }
    .sub { font-family: monospace; font-weight: 400; font-size: 11px; fill: #8aaa00; letter-spacing: 3px; }
  </style>

  <rect width="680" height="340" rx="8" class="bg"/>

  <polyline fill="none" stroke="#c8f000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="40,170 60,170 75,130 90,210 105,130 120,210 135,150 155,170 175,170"/>
  <line x1="175" y1="170" x2="210" y2="170" stroke="#c8f000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="230" y1="110" x2="230" y2="230" stroke="#c8f000" stroke-width="1.5" opacity="0.4"/>

  <text x="260" y="215" class="num">303</text>
  <text x="260" y="252" class="wordmark">squelch</text>
  <text x="260" y="278" class="sub">DJ TOOLS · UNDERGROUND ELECTRONIC</text>

  <g opacity="0.25">
    <circle cx="580" cy="110" r="2.5" fill="#c8f000"/>
    <circle cx="600" cy="110" r="2.5" fill="#c8f000"/>
    <circle cx="620" cy="110" r="2.5" fill="#c8f000"/>
    <circle cx="580" cy="130" r="2.5" fill="#c8f000"/>
    <circle cx="600" cy="130" r="2.5" fill="#c8f000"/>
    <circle cx="620" cy="130" r="2.5" fill="#c8f000"/>
    <circle cx="580" cy="150" r="2.5" fill="#c8f000"/>
    <circle cx="600" cy="150" r="2.5" fill="#c8f000"/>
    <circle cx="620" cy="150" r="2.5" fill="#c8f000"/>
  </g>

  <circle cx="100" cy="260" r="30" fill="none" stroke="#c8f000" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="260" r="20" fill="none" stroke="#c8f000" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="260" r="10" fill="none" stroke="#c8f000" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="260" r="3" fill="#c8f000" opacity="0.7"/>
</svg>
